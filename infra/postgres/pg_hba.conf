# Client authentication for the platform Postgres container, mounted at /etc/postgresql/pg_hba.conf.
# TYPE  DATABASE  USER      ADDRESS          METHOD
local   all       all                        peer            # docker compose exec -u postgres db psql
host    all       postgres  0.0.0.0/0        reject          # superuser never over the network
host    all       all       127.0.0.1/32     scram-sha-256
host    all       all       172.30.0.0/24    scram-sha-256   # compose "backend" network (see compose.yaml)
