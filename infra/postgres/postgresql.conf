# Postgres settings for the platform Droplet, mounted at /etc/postgresql/postgresql.conf.
# Memory sizing is written by provision.sh to local/tuning.conf (included below).

listen_addresses = '*'          # inside the container only: no ports are published, pg_hba limits clients
port = 5432
max_connections = 100
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

shared_preload_libraries = 'pg_stat_statements'

# Conservative defaults, overridden by local/tuning.conf
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
random_page_cost = 1.1          # SSD
wal_compression = zstd

# Continuous archiving to the pgBackRest repository (Spaces). Caps data loss at about a minute.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 60

log_timezone = 'UTC'
timezone = 'UTC'

include_if_exists = '/etc/postgresql/local/tuning.conf'
